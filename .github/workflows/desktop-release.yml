# =============================================================================
# Desktop Release  (Robot B)
# -----------------------------------------------------------------------------
# Builds + signs the desktop installers and attaches them to the GitHub
# Release page. Fires when you cut a CalVer tag (e.g. v2026.8.14) — which
# scripts/release.py does for you — or when you publish a release manually.
#
#   - Windows: built + signed with your existing Azure certificate (OIDC).
#   - Linux:   built (AppImage + Deb), no signing needed.
#   - macOS:   included but DISABLED (if: false) — it needs a paid Apple
#              developer cert + 5 repo secrets. Flip it on once you have those.
#
# This replaces the manual, admin-gated build-windows-installer.yml flow with
# a one-command release. (build-windows-installer.yml can stay for ad-hoc
# manual Windows-only builds; it's not touched here.)
# =============================================================================

name: Desktop Release

on:
  push:
    tags: ['v*']            # CalVer tags created by scripts/release.py
  release:
    types: [published]      # also run if you publish a release in the UI
  workflow_dispatch:        # and allow a manual run from the Actions tab

# Needs write access so it can upload installer files to the Release.
permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Windows installer (NSIS), signed via Azure
  # ---------------------------------------------------------------------------
  windows:
    name: Windows installer (NSIS, signed)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write       # upload to the Release
      id-token: write       # Azure OIDC federated signing
    steps:
      - name: Check out your code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Install Rust (for the Tauri installer)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/bootstrap-installer/src-tauri

      - name: Build the installer
        run: npm run tauri:build
        working-directory: apps/bootstrap-installer

      - name: Azure login (OIDC, no stored secret)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Anakot-Setup.exe with Azure Artifact Signing
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_CERTIFICATE_PROFILE }}
          # Sign both the raw exe and the bundled NSIS installer.
          files-folder: ${{ github.workspace }}\apps\bootstrap-installer\src-tauri\target\release
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/bootstrap-installer/src-tauri/target/release/bundle/nsis/*.exe
            apps/bootstrap-installer/src-tauri/target/release/Anakot-Setup.exe

  # ---------------------------------------------------------------------------
  # Linux installer (AppImage + Deb) — no signing needed
  # ---------------------------------------------------------------------------
  linux:
    name: Linux installer (AppImage / Deb)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out your code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Install Rust (for the Tauri installer)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/bootstrap-installer/src-tauri

      - name: Build the installer
        run: npm run tauri:build
        working-directory: apps/bootstrap-installer

      # tauri.conf.json targets -> on Linux this produces .deb + .AppImage.
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/bootstrap-installer/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/bootstrap-installer/src-tauri/target/release/bundle/deb/*.deb

  # ---------------------------------------------------------------------------
  # macOS installer (dmg) — DISABLED until you have Apple signing certs.
  # To enable: add secrets APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
  # APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID, then change `if: false` -> `if: true`.
  # ---------------------------------------------------------------------------
  macos:
    if: false
    name: macOS installer (dmg) — requires signing
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Check out your code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Install Rust (for the Tauri installer)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/bootstrap-installer/src-tauri

      - name: Import Apple signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 -d > cert.p12
          security create-keychain -p '' build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s build.keychain login.keychain

      - name: Build + sign the installer
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CI: 'true'
        run: npm run tauri:build
        working-directory: apps/bootstrap-installer

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/bootstrap-installer/src-tauri/target/release/bundle/dmg/*.dmg
