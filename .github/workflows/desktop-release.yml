# =============================================================================
# Desktop Release  (Robot B)
# -----------------------------------------------------------------------------
# Builds the desktop installers (Windows UNSIGNED — free, no Azure cert) and
# attaches them to the GitHub Release page. Fires when you cut a CalVer tag
# (e.g. v2026.8.14) — which scripts/release.py does for you — or when you
# publish a release manually.
#
#   - Windows: built UNSIGNED (free — no Azure cert/OIDC). Users get a
#             SmartScreen "unrecognized publisher" warning, but it installs
#             and runs. Re-add Azure Trusted Signing steps later for a signed
#             build.
#   - Linux:   built (AppImage + Deb), no signing needed.
#   - macOS:   included but DISABLED (if: false) — it needs a paid Apple
#              developer cert + 5 repo secrets. Flip it on once you have those.
#
# This replaces the manual, admin-gated build-windows-installer.yml flow with
# a one-command release. (build-windows-installer.yml can stay for ad-hoc
# manual Windows-only builds; it's not touched here.)
# =============================================================================

name: Desktop Release

on:
  push:
    tags: ['v*']            # CalVer tags created by scripts/release.py
  release:
    types: [published]      # also run if you publish a release in the UI
  workflow_dispatch:        # and allow a manual run from the Actions tab

# Needs write access so it can upload installer files to the Release.
permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Windows installer (NSIS), signed via Azure
  # ---------------------------------------------------------------------------
  windows:
    name: Windows installer (NSIS, unsigned)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write       # upload to the Release
    steps:
      - name: Check out your code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Install Rust (for the Tauri installer)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/bootstrap-installer/src-tauri

      - name: Build the installer (unsigned — free alternative)
        run: npm run tauri:build
        working-directory: apps/bootstrap-installer

      # NOTE: Windows installer is built UNSIGNED (free alternative — no Azure
      # cert/OIDC needed). Users get a SmartScreen "unrecognized publisher"
      # warning, but it installs and runs. To sign later, set up Azure Trusted
      # Signing + the AZURE_* secrets/vars and re-add the azure/login +
      # azure/artifact-signing-action steps here.

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/bootstrap-installer/src-tauri/target/release/bundle/nsis/*.exe
            apps/bootstrap-installer/src-tauri/target/release/Anakot-Setup.exe

  # ---------------------------------------------------------------------------
  # Linux installer (AppImage + Deb) — no signing needed
  # ---------------------------------------------------------------------------
  linux:
    name: Linux installer (AppImage / Deb)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out your code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Install Linux system dependencies (GTK/WebKit for Tauri build)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libappindicator3-dev \
            patchelf pkg-config

      - name: Install Rust (for the Tauri installer)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/bootstrap-installer/src-tauri

      - name: Build the installer
        run: npm run tauri:build
        working-directory: apps/bootstrap-installer

      # tauri.conf.json targets -> on Linux this produces .deb + .AppImage.
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/bootstrap-installer/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/bootstrap-installer/src-tauri/target/release/bundle/deb/*.deb

  # ---------------------------------------------------------------------------
  # macOS installer (dmg) — DISABLED until you have Apple signing certs.
  # To enable: add secrets APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
  # APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID, then change `if: false` -> `if: true`.
  # ---------------------------------------------------------------------------
  macos:
    if: false
    name: macOS installer (dmg) — requires signing
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Check out your code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Install Rust (for the Tauri installer)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/bootstrap-installer/src-tauri

      - name: Import Apple signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 -d > cert.p12
          security create-keychain -p '' build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s build.keychain login.keychain

      - name: Build + sign the installer
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CI: 'true'
        run: npm run tauri:build
        working-directory: apps/bootstrap-installer

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/bootstrap-installer/src-tauri/target/release/bundle/dmg/*.dmg
