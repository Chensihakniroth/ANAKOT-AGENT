<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wake Indicator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    body { display: flex; align-items: center; justify-content: center; }

    .indicator {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(0, 212, 255, 0.3);
      border: 2px solid rgba(0, 212, 255, 0.6);
      transition: all 0.3s ease;
      opacity: 0;
      transform: scale(0.8);
    }

    .indicator.visible {
      opacity: 1;
      transform: scale(1);
    }

    .indicator.listening {
      background: rgba(0, 212, 255, 0.2);
      border-color: rgba(0, 212, 255, 0.5);
      animation: pulse 2s ease-in-out infinite;
    }

    .indicator.detected {
      background: rgba(0, 255, 136, 0.5);
      border-color: rgba(0, 255, 136, 0.9);
      animation: flash 0.5s ease-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; }
    }

    @keyframes flash {
      0% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(1); opacity: 0.8; }
    }
  </style>
</head>
<body>
  <div id="indicator" class="indicator"></div>
  <script>
    const indicator = document.getElementById('indicator');
    let currentState = 'hidden';

    function setState(state) {
      currentState = state;
      indicator.className = 'indicator';

      if (state === 'hidden') {
        return;
      }

      indicator.classList.add('visible');

      if (state === 'listening') {
        indicator.classList.add('listening');
      } else if (state === 'detected') {
        indicator.classList.add('detected');
      }
    }

    // Listen for state changes from main process
    if (window.anakotDesktop && window.anakotDesktop.wakeIndicator) {
      window.anakotDesktop.wakeIndicator.onState(function(state) {
        setState(state);
      });

      // Get initial state
      window.anakotDesktop.wakeIndicator.getState().then(function(result) {
        if (result && result.state) {
          setState(result.state);
        }
      }).catch(function() {});
    }
  </script>
</body>
</html>
